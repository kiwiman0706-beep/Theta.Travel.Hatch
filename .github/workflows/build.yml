name: build

# Every push / PR: web logic unit tests, browser UI smoke tests, Gradle build + lint.
# The APK built here is debug-signed and only kept as a CI artifact (not a release).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (core.js)
        run: node --test source/web-tests/*.test.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: UI smoke tests
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node source/web-tests/ui-smoke.cjs
          node source/web-tests/bridge-smoke.cjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and lint
        working-directory: source
        run: ./gradlew --no-daemon assembleDebug lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tabi-no-tane-debug
          path: source/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: source/app/build/reports/lint-results-release.html
          retention-days: 14
