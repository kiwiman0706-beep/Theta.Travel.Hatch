  const main=root.querySelector('.tm-main');
  const modal=root.querySelector('.tm-modal');
  const state={screen:'home',condition:'rain',query:'',suggested:false,selected:'アドベンチャーワールド',day:1,planSection:'itinerary',transportMode:'transit',routeDir:'out',spotView:'map',spotFilter:'all',historyView:'list',historyQuery:'',toast:'',mapPick:'',places:[{name:'アドベンチャーワールド',icon:'🐼',tone:'peach',meta:'白浜 · 動物と一日たっぷり',region:'和歌山'},{name:'奈良公園',icon:'🦌',tone:'mint',meta:'奈良 · のんびりお散歩',region:'奈良'},{name:'海遊館',icon:'🐠',tone:'yellow',meta:'大阪 · 雨の日の候補',region:'大阪'}],visits:[{date:'2026.08',name:'海遊館',weather:'☔ 雨',icon:'🐠'},{date:'2026.05',name:'神戸どうぶつ王国',weather:'☀ 晴れ',icon:'🦜'},{date:'2025.12',name:'白浜',weather:'☁ くもり',icon:'🌊'}],routes:{out:{from:'大阪駅',via:'天王寺駅',to:'白浜駅',time:'14:00',memo:'路線・便・切符のメモ'},back:{from:'白浜駅',via:'天王寺駅',to:'大阪駅',time:'15:00',memo:'帰りの便を登録'}},carNote:'駐車場・休憩場所をメモ',pack:[{name:'チケット・予約確認',done:true},{name:'子どもの着替え',done:false},{name:'レインコート',done:false},{name:'おやつ・飲み物',done:true},{name:'充電器',done:false},{name:'保険証',done:false}]};
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button=(label,action,cls='tm-primary')=>`<button class="${cls} cursor-interaction" type="button" data-action="${action}">${label}</button>`;
  function placeCard(p,action='plan-place'){return `<div class="tm-place-card"><div class="tm-art ${p.tone}" aria-hidden="true">${p.icon}</div><div><div class="tm-card-title">${esc(p.name)}</div><div class="tm-card-meta">${esc(p.meta)}</div><button type="button" class="tm-card-action cursor-interaction" data-action="${action}" data-place="${esc(p.name)}">しおりに入れる →</button></div></div>`}
  function home(){const candidate=state.condition==='rain'?{name:'海遊館',icon:'🐠',reason:'雨の条件なら屋内の候補。以前の訪問記録も見ながら選べます。'}:state.condition==='overnight'?{name:'アドベンチャーワールド',icon:'🐼',reason:'1泊の行き先として保存済み。休憩を含む行程の下書きを作れます。'}:{name:'奈良公園',icon:'🦌',reason:'午後からのおでかけ候補。出発時刻に合わせて短めの行程を考えます。'};
    return `<div class="tm-hero"><span class="tm-eyebrow" style="color:inherit">今日のおでかけ、ここから</span><h1>行きたい気持ちが、<br>旅のはじまり。</h1><p>思いついたら、たびのたねに。</p><i class="tm-sun" aria-hidden="true"></i><i class="tm-hill-a" aria-hidden="true"></i><i class="tm-hill-b" aria-hidden="true"></i><span class="tm-stamp">LET'S GO! ✦</span></div><div class="tm-query"><label for="tm-query">どんなおでかけにする？</label><input id="tm-query" value="${esc(state.query)}" placeholder="例：今から白浜に1泊したい"><div class="tm-chips" aria-label="今日の条件"><button class="tm-chip cursor-interaction" type="button" data-condition="rain" aria-pressed="${state.condition==='rain'}">☔ 雨の日</button><button class="tm-chip cursor-interaction" type="button" data-condition="afternoon" aria-pressed="${state.condition==='afternoon'}">🕒 午後から</button><button class="tm-chip cursor-interaction" type="button" data-condition="overnight" aria-pressed="${state.condition==='overnight'}">🧳 今から1泊</button></div>${button('✦　条件に合う場所を見る','suggest')}</div>${state.suggested?`<div class="tm-suggest-card"><span class="tm-result-icon" aria-hidden="true">${candidate.icon}</span><span class="tm-eyebrow">サンプル提案</span><h2>${candidate.name}</h2><p>${candidate.reason}</p><button type="button" class="tm-primary cursor-interaction" data-action="suggest-plan" data-place="${candidate.name}">この場所でしおりを作る →</button></div>`:''}<div class="tm-section-head"><h2>気になる旅のたね</h2><button class="tm-text-link cursor-interaction" type="button" data-screen="wish">地図で見る →</button></div><div class="tm-list">${state.places.slice(0,2).map(p=>placeCard(p)).join('')}</div>`}
  function allSpots(){
    const byName=new Map();
    state.places.forEach(p=>byName.set(p.name,{...p,wish:true,visits:0}));
    state.visits.forEach(v=>{const p=byName.get(v.name)||{name:v.name,icon:v.icon,tone:'mint',meta:'訪問した場所',region:v.name.includes('神戸')?'神戸':v.name.includes('白浜')?'和歌山':'大阪',wish:false,visits:0};p.visits++;byName.set(v.name,p)});
    return [...byName.values()];
  }
  function status(p){return p.wish&&p.visits?'行きたい・行った':p.wish?'行きたい':'行った'}
  function position(p,i){const named={'アドベンチャーワールド':[67,70],'奈良公園':[76,34],'海遊館':[46,37],'神戸どうぶつ王国':[21,47],'白浜':[56,81]};if(named[p.name])return named[p.name];const regions={'大阪':[29,61],'和歌山':[31,72],'奈良':[78,55],'神戸':[17,71]};const base=regions[p.region]||[48,55];return [Math.min(82,base[0]+(i%3)*8),Math.min(82,base[1]+(i%3)*9)]}
  function mapPanel(items){return `<div class="tm-legend"><span><i class="tm-dot wish"></i>行きたい</span><span><i class="tm-dot visited"></i>行った</span><span><i class="tm-dot both"></i>両方</span></div><div class="tm-map" role="group" aria-label="スポットの配置イメージ"><span class="tm-map-label osaka">大阪</span><span class="tm-map-label kobe">神戸</span><span class="tm-map-label nara">奈良</span><span class="tm-map-label shirahama">白浜</span>${items.map((p,i)=>{const [x,y]=position(p,i);const kind=p.wish&&p.visits?'both':p.wish?'wish':'visited';return `<button class="tm-pin cursor-interaction ${kind}" style="left:${x}%;top:${y}%" type="button" data-map-pick="${esc(p.name)}" aria-label="${esc(p.name)}、${status(p)}"><span>${p.icon}</span></button>`}).join('')}</div>${state.mapPick?(()=>{const p=allSpots().find(x=>x.name===state.mapPick);return p?`<div class="tm-map-detail"><strong>${p.icon}　${esc(p.name)}</strong><span>${status(p)}</span><button type="button" class="tm-card-action cursor-interaction" data-action="plan-place" data-place="${esc(p.name)}">この場所でしおりを作る →</button></div>`:''})():''}<p class="tm-map-note">ピンの位置は画面案の例です。実際のアプリでは場所を確認して地図に表示します。</p>`}
  function wish(){const spots=allSpots();const filtered=spots.filter(p=>state.spotFilter==='all'||state.spotFilter==='wish'&&p.wish||state.spotFilter==='visited'&&p.visits);return `<div class="tm-page-top"><span class="tm-eyebrow">SPOT MAP ◎</span><h1>旅のスポット</h1><p>行きたい場所も、行った場所も、一枚に。</p></div><div class="tm-view-tabs" aria-label="スポットの表示"><button class="cursor-interaction" type="button" data-spot-view="map" aria-pressed="${state.spotView==='map'}">地図</button><button class="cursor-interaction" type="button" data-spot-view="list" aria-pressed="${state.spotView==='list'}">一覧</button></div><div class="tm-chips tm-spot-filters" aria-label="スポットの状態"><button class="tm-chip cursor-interaction" type="button" data-spot-filter="all" aria-pressed="${state.spotFilter==='all'}">すべて ${spots.length}</button><button class="tm-chip cursor-interaction" type="button" data-spot-filter="wish" aria-pressed="${state.spotFilter==='wish'}">♡ 行きたい</button><button class="tm-chip cursor-interaction" type="button" data-spot-filter="visited" aria-pressed="${state.spotFilter==='visited'}">✓ 行った</button></div>${state.spotView==='map'?mapPanel(filtered):`<div class="tm-list">${filtered.map(p=>`<div class="tm-wish-card">${placeCard(p)}<span class="tm-spot-status">${status(p)}</span></div>`).join('')}</div>`}<div style="margin-top:13px">${button('＋　スポットを追加','add','tm-outline')}</div>`}
  function itinerary(){const n=esc(state.selected);const day1=[['14:00','出発','おやつや休憩の時間も確保'],['16:30','到着・チェックイン','宿泊先はこれから選択'],['18:00','夕食','近くでゆったり']];const day2=[['09:30',n,'営業時間・チケットは要確認'],['12:30','昼食とひと休み','子どものペースで'],['15:00','帰路へ','混雑や天候に合わせて調整']];const entries=state.day===1?day1:day2;return `<div class="tm-day-tabs" aria-label="旅の日程"><button class="cursor-interaction" type="button" data-day="1" aria-pressed="${state.day===1}">1日目</button><button class="cursor-interaction" type="button" data-day="2" aria-pressed="${state.day===2}">2日目</button></div><div class="tm-timeline">${entries.map(e=>`<div class="tm-stop"><strong>${e[0]}　${e[1]}</strong><p>${e[2]}</p></div>`).join('')}</div><div class="tm-note">☔ 雨なら屋内の候補へ変更。営業・空室・移動時間は実際の計画時に確認します。</div>${button('✓　しおりを保存','save-plan')}${button('行った思い出として記録','record','tm-outline')}`}
  function travel(){const r=state.routes[state.routeDir];return `<div class="tm-section-head"><h2>どうやって行く？</h2></div><div class="tm-day-tabs" aria-label="移動手段"><button class="cursor-interaction" type="button" data-transport="transit" aria-pressed="${state.transportMode==='transit'}">🚃 電車・バス</button><button class="cursor-interaction" type="button" data-transport="car" aria-pressed="${state.transportMode==='car'}">🚗 車</button></div>${state.transportMode==='car'?`<div class="tm-route-card"><strong>車での移動メモ</strong><p>駐車場や立ち寄り場所を書いておけます。</p><label for="tm-car-note">メモ</label><input id="tm-car-note" value="${esc(state.carNote)}">${button('移動メモを保存','save-car','tm-outline')}</div>`:`<div class="tm-day-tabs" aria-label="往復の切替"><button class="cursor-interaction" type="button" data-route-dir="out" aria-pressed="${state.routeDir==='out'}">往路</button><button class="cursor-interaction" type="button" data-route-dir="back" aria-pressed="${state.routeDir==='back'}">復路</button></div><div class="tm-route-card"><span class="tm-eyebrow">登録した乗換メモ</span><div class="tm-route-stops"><div><b>●</b><span>${esc(r.time)}　${esc(r.from)}</span></div><div><b>↳</b><span>${esc(r.via)}で乗換</span></div><div><b>●</b><span>${esc(r.to)} に到着</span></div></div><p>🎫 ${esc(r.memo)}</p></div><details class="tm-route-edit"><summary class="cursor-interaction">✎　乗換情報を編集する</summary><div class="tm-route-form"><label for="tm-from">出発駅・停留所</label><input id="tm-from" value="${esc(r.from)}"><label for="tm-via">乗換駅・停留所</label><input id="tm-via" value="${esc(r.via)}"><label for="tm-to">到着駅・停留所</label><input id="tm-to" value="${esc(r.to)}"><label for="tm-time">出発時刻</label><input id="tm-time" type="time" value="${esc(r.time)}"><label for="tm-route-memo">路線・便・切符のメモ</label><input id="tm-route-memo" value="${esc(r.memo)}">${button('乗換情報を保存','save-route')}</div></details><p class="tm-map-note">時刻と路線は入力例です。実際の乗換案内とは連動していません。</p>`}`}
  function packing(){const done=state.pack.filter(p=>p.done).length;return `<div class="tm-section-head"><h2>旅の持ち物</h2><span class="tm-pack-count">${done} / ${state.pack.length} 準備OK</span></div><div class="tm-pack-progress" role="progressbar" aria-label="持ち物の準備" aria-valuemin="0" aria-valuemax="${state.pack.length}" aria-valuenow="${done}"><i style="width:${state.pack.length?done/state.pack.length*100:0}%"></i></div><div class="tm-pack-list">${state.pack.map((p,i)=>`<label class="tm-pack-row"><input type="checkbox" data-pack-index="${i}" ${p.done?'checked':''}><span class="${p.done?'done':''}">${esc(p.name)}</span></label>`).join('')}</div><div class="tm-pack-add"><input id="tm-new-pack" aria-label="新しい持ち物" placeholder="持ち物を追加"><button class="cursor-interaction" type="button" data-action="pack-add" aria-label="持ち物を追加">＋</button></div><button class="tm-text-link cursor-interaction" type="button" data-action="pack-suggest">✦　雨の日の持ち物例を追加</button>`}
  function plan(){const n=esc(state.selected);return `<div class="tm-page-top"><span class="tm-eyebrow">MY TRIP ▤</span><h1>旅のしおり</h1><p>行程も移動も持ち物も、ひとまとめに。</p></div><div class="tm-plan-cover"><span class="tm-eyebrow">サンプルの行程</span><h2>${n}へ<br>わくわく1泊旅</h2><p>大阪発 · 家族のおでかけ</p><span class="tm-panda" aria-hidden="true">🧳</span></div><div class="tm-plan-tabs" aria-label="しおりの内容"><button class="cursor-interaction" type="button" data-plan-section="itinerary" aria-pressed="${state.planSection==='itinerary'}">行程</button><button class="cursor-interaction" type="button" data-plan-section="travel" aria-pressed="${state.planSection==='travel'}">移動・乗換</button><button class="cursor-interaction" type="button" data-plan-section="packing" aria-pressed="${state.planSection==='packing'}">持ち物</button></div>${state.planSection==='itinerary'?itinerary():state.planSection==='travel'?travel():packing()}${state.toast?`<div class="tm-toast" role="status">${esc(state.toast)}</div>`:''}`}
  function history(){const q=state.historyQuery.trim().toLowerCase();const visits=state.visits.filter(v=>(v.name+v.weather+v.date).toLowerCase().includes(q));const view=state.historyView;return `<div class="tm-page-top"><span class="tm-eyebrow">MEMORIES ✧</span><h1>行ったところ</h1><p>おでかけの記録を、あとから探せる。</p></div><input class="tm-history-search" id="tm-history-query" aria-label="訪問履歴を検索" value="${esc(state.historyQuery)}" placeholder="場所・雨の日・年月で検索"><div class="tm-view-tabs" aria-label="履歴の表示方法"><button class="cursor-interaction" type="button" data-view="list" aria-pressed="${view==='list'}">一覧</button><button class="cursor-interaction" type="button" data-view="table" aria-pressed="${view==='table'}">表</button><button class="cursor-interaction" type="button" data-view="map" aria-pressed="${view==='map'}">地図</button></div>${!visits.length?'<div class="tm-empty">見つかりませんでした。別の言葉で探してみてね。</div>':view==='list'?visits.map(v=>`<div class="tm-log-card"><div class="tm-log-icon" aria-hidden="true">${v.icon}</div><div><strong>${esc(v.name)}</strong><span>${esc(v.date)} · ${esc(v.weather)}</span></div></div>`).join(''):view==='table'?`<table class="tm-table"><thead><tr><th>いつ</th><th>どこへ</th><th>天気</th></tr></thead><tbody>${visits.map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.name)}</td><td>${esc(v.weather)}</td></tr>`).join('')}</tbody></table>`:mapPanel(allSpots().filter(p=>visits.some(v=>v.name===p.name)))}`}
  function render(){main.innerHTML=state.screen==='home'?home():state.screen==='wish'?wish():state.screen==='plan'?plan():history();root.querySelectorAll('.tm-nav [data-screen]').forEach(b=>{if(b.dataset.screen===state.screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.screen){state.screen=b.dataset.screen;state.toast='';state.mapPick='';render();return}if(b.dataset.condition){state.condition=b.dataset.condition;state.suggested=false;render();return}if(b.dataset.day){state.day=Number(b.dataset.day);render();return}if(b.dataset.view){state.historyView=b.dataset.view;state.mapPick='';render();return}if(b.dataset.spotView){state.spotView=b.dataset.spotView;state.mapPick='';render();return}if(b.dataset.spotFilter){state.spotFilter=b.dataset.spotFilter;state.mapPick='';render();return}if(b.dataset.planSection){state.planSection=b.dataset.planSection;state.toast='';render();return}if(b.dataset.transport){state.transportMode=b.dataset.transport;render();return}if(b.dataset.routeDir){state.routeDir=b.dataset.routeDir;render();return}if(b.dataset.mapPick){state.mapPick=b.dataset.mapPick;render();return}const a=b.dataset.action;if(a==='add'){modal.hidden=false;root.querySelector('#tm-place').value='';root.querySelector('.tm-modal-error').hidden=true;root.querySelector('#tm-place').focus()}else if(a==='close'){modal.hidden=true}else if(a==='save-place'){const field=root.querySelector('#tm-place');const name=field.value.trim();if(!name){root.querySelector('.tm-modal-error').hidden=false;field.focus();return}const region=root.querySelector('#tm-region').value;state.places.unshift({name,icon:'🌈',tone:'yellow',meta:region+' · 新しく追加した旅のたね',region});modal.hidden=true;state.screen='wish';state.spotView='map';state.spotFilter='all';render()}else if(a==='suggest'){const q=state.query.toLowerCase();if(q.includes('白浜')||q.includes('1泊'))state.condition='overnight';state.suggested=true;render()}else if(a==='suggest-plan'||a==='plan-place'){state.selected=b.dataset.place||'アドベンチャーワールド';state.screen='plan';state.day=1;state.planSection='itinerary';state.toast='';render()}else if(a==='save-plan'){state.toast='この画面では、しおりを保存した状態を表示しています。';render()}else if(a==='record'){state.visits.unshift({date:'サンプル',name:state.selected,weather:'☁ 未入力',icon:'🧳'});state.screen='history';state.historyView='list';render()}else if(a==='save-route'){const r=state.routes[state.routeDir];for(const [key,id] of [['from','#tm-from'],['via','#tm-via'],['to','#tm-to'],['time','#tm-time'],['memo','#tm-route-memo']])r[key]=root.querySelector(id).value.trim();state.toast='乗換メモを登録しました。';render()}else if(a==='save-car'){state.carNote=root.querySelector('#tm-car-note').value.trim();state.toast='移動メモを登録しました。';render()}else if(a==='pack-add'){const f=root.querySelector('#tm-new-pack');const name=f.value.trim();if(name){state.pack.push({name,done:false});render()}else f.focus()}else if(a==='pack-suggest'){for(const name of ['折りたたみ傘','ビニール袋'])if(!state.pack.some(p=>p.name===name))state.pack.push({name,done:false});render()}});
  root.addEventListener('input',e=>{if(e.target.id==='tm-query')state.query=e.target.value;if(e.target.id==='tm-history-query'){state.historyQuery=e.target.value;const pos=e.target.selectionStart;render();const next=root.querySelector('#tm-history-query');next.focus();next.setSelectionRange(pos,pos)}});
  root.addEventListener('change',e=>{if(e.target.dataset.packIndex!==undefined){state.pack[Number(e.target.dataset.packIndex)].done=e.target.checked;render()}});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)modal.hidden=true;if(e.key==='Enter'&&e.target.id==='tm-place'){e.preventDefault();root.querySelector('[data-action="save-place"]').click()}if(e.key==='Enter'&&e.target.id==='tm-query'){e.preventDefault();root.querySelector('[data-action="suggest"]').click()}if(e.key==='Enter'&&e.target.id==='tm-new-pack'){e.preventDefault();root.querySelector('[data-action="pack-add"]').click()}});
  render();
})();
</script>
