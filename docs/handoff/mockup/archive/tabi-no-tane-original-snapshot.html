#travel-mockup .tm-route-card label,#travel-mockup .tm-route-form label{font-size:12px;font-weight:800;display:block;margin:8px 0 5px}
#travel-mockup .tm-route-stops{display:grid;gap:8px;margin:12px 0;font-size:13px;font-weight:750}
#travel-mockup .tm-route-stops div{display:flex;gap:10px;align-items:center}
#travel-mockup .tm-route-stops b{width:16px;color:var(--tm-coral);text-align:center}
#travel-mockup .tm-route-edit{border:1px solid var(--tm-line);border-radius:14px;background:var(--tm-paper);padding:10px 13px}
#travel-mockup .tm-route-edit summary{font-size:13px;font-weight:800;color:var(--tm-teal);min-height:30px;padding-top:5px}
#travel-mockup .tm-route-form{padding:4px 0 5px}
#travel-mockup .tm-route-form .tm-primary{margin-top:14px}
#travel-mockup .tm-pack-count{font-size:12px;font-weight:800;color:var(--tm-teal)}
#travel-mockup .tm-pack-progress{height:8px;background:var(--tm-line);border-radius:999px;overflow:hidden;margin:11px 2px}
#travel-mockup .tm-pack-progress i{display:block;height:100%;background:var(--tm-teal);border-radius:999px}
#travel-mockup .tm-pack-list{display:grid;gap:8px;margin:14px 0}
#travel-mockup .tm-pack-row{min-height:48px;display:flex;gap:11px;align-items:center;padding:8px 12px;border:1px solid var(--tm-line);border-radius:13px;background:var(--tm-paper);font-size:13px;font-weight:750}
#travel-mockup .tm-pack-row input{width:19px;height:19px;accent-color:var(--tm-teal);flex:none}
#travel-mockup .tm-pack-row .done{text-decoration:line-through;color:var(--tm-soft)}
#travel-mockup .tm-pack-add{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:7px}
#travel-mockup .tm-pack-add button{border-radius:13px;background:var(--tm-yellow);color:var(--tm-text);font-size:26px}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;travel-mockup&#x27;);
  const main=root.querySelector(&#x27;.tm-main&#x27;);
  const modal=root.querySelector(&#x27;.tm-modal&#x27;);
  const state={screen:&#x27;home&#x27;,condition:&#x27;rain&#x27;,query:&#x27;&#x27;,suggested:false,selected:&#x27;アドベンチャーワールド&#x27;,day:1,planSection:&#x27;itinerary&#x27;,transportMode:&#x27;transit&#x27;,routeDir:&#x27;out&#x27;,spotView:&#x27;map&#x27;,spotFilter:&#x27;all&#x27;,historyView:&#x27;list&#x27;,historyQuery:&#x27;&#x27;,toast:&#x27;&#x27;,mapPick:&#x27;&#x27;,places:[{name:&#x27;アドベンチャーワールド&#x27;,icon:&#x27;🐼&#x27;,tone:&#x27;peach&#x27;,meta:&#x27;白浜 · 動物と一日たっぷり&#x27;,region:&#x27;和歌山&#x27;},{name:&#x27;奈良公園&#x27;,icon:&#x27;🦌&#x27;,tone:&#x27;mint&#x27;,meta:&#x27;奈良 · のんびりお散歩&#x27;,region:&#x27;奈良&#x27;},{name:&#x27;海遊館&#x27;,icon:&#x27;🐠&#x27;,tone:&#x27;yellow&#x27;,meta:&#x27;大阪 · 雨の日の候補&#x27;,region:&#x27;大阪&#x27;}],visits:[{date:&#x27;2026.08&#x27;,name:&#x27;海遊館&#x27;,weather:&#x27;☔ 雨&#x27;,icon:&#x27;🐠&#x27;},{date:&#x27;2026.05&#x27;,name:&#x27;神戸どうぶつ王国&#x27;,weather:&#x27;☀ 晴れ&#x27;,icon:&#x27;🦜&#x27;},{date:&#x27;2025.12&#x27;,name:&#x27;白浜&#x27;,weather:&#x27;☁ くもり&#x27;,icon:&#x27;🌊&#x27;}],routes:{out:{from:&#x27;大阪駅&#x27;,via:&#x27;天王寺駅&#x27;,to:&#x27;白浜駅&#x27;,time:&#x27;14:00&#x27;,memo:&#x27;路線・便・切符のメモ&#x27;},back:{from:&#x27;白浜駅&#x27;,via:&#x27;天王寺駅&#x27;,to:&#x27;大阪駅&#x27;,time:&#x27;15:00&#x27;,memo:&#x27;帰りの便を登録&#x27;}},carNote:&#x27;駐車場・休憩場所をメモ&#x27;,pack:[{name:&#x27;チケット・予約確認&#x27;,done:true},{name:&#x27;子どもの着替え&#x27;,done:false},{name:&#x27;レインコート&#x27;,done:false},{name:&#x27;おやつ・飲み物&#x27;,done:true},{name:&#x27;充電器&#x27;,done:false},{name:&#x27;保険証&#x27;,done:false}]};
  const esc=(s)=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const button=(label,action,cls=&#x27;tm-primary&#x27;)=&gt;`&lt;button class=&quot;${cls} cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;${action}&quot;&gt;${label}&lt;/button&gt;`;
  function placeCard(p,action=&#x27;plan-place&#x27;){return `&lt;div class=&quot;tm-place-card&quot;&gt;&lt;div class=&quot;tm-art ${p.tone}&quot; aria-hidden=&quot;true&quot;&gt;${p.icon}&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;tm-card-title&quot;&gt;${esc(p.name)}&lt;/div&gt;&lt;div class=&quot;tm-card-meta&quot;&gt;${esc(p.meta)}&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;tm-card-action cursor-interaction&quot; data-action=&quot;${action}&quot; data-place=&quot;${esc(p.name)}&quot;&gt;しおりに入れる →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`}
  function home(){const candidate=state.condition===&#x27;rain&#x27;?{name:&#x27;海遊館&#x27;,icon:&#x27;🐠&#x27;,reason:&#x27;雨の条件なら屋内の候補。以前の訪問記録も見ながら選べます。&#x27;}:state.condition===&#x27;overnight&#x27;?{name:&#x27;アドベンチャーワールド&#x27;,icon:&#x27;🐼&#x27;,reason:&#x27;1泊の行き先として保存済み。休憩を含む行程の下書きを作れます。&#x27;}:{name:&#x27;奈良公園&#x27;,icon:&#x27;🦌&#x27;,reason:&#x27;午後からのおでかけ候補。出発時刻に合わせて短めの行程を考えます。&#x27;};
    return `&lt;div class=&quot;tm-hero&quot;&gt;&lt;span class=&quot;tm-eyebrow&quot; style=&quot;color:inherit&quot;&gt;今日のおでかけ、ここから&lt;/span&gt;&lt;h1&gt;行きたい気持ちが、&lt;br&gt;旅のはじまり。&lt;/h1&gt;&lt;p&gt;思いついたら、たびのたねに。&lt;/p&gt;&lt;i class=&quot;tm-sun&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i class=&quot;tm-hill-a&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i class=&quot;tm-hill-b&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;tm-stamp&quot;&gt;LET&#x27;S GO! ✦&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tm-query&quot;&gt;&lt;label for=&quot;tm-query&quot;&gt;どんなおでかけにする？&lt;/label&gt;&lt;input id=&quot;tm-query&quot; value=&quot;${esc(state.query)}&quot; placeholder=&quot;例：今から白浜に1泊したい&quot;&gt;&lt;div class=&quot;tm-chips&quot; aria-label=&quot;今日の条件&quot;&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-condition=&quot;rain&quot; aria-pressed=&quot;${state.condition===&#x27;rain&#x27;}&quot;&gt;☔ 雨の日&lt;/button&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-condition=&quot;afternoon&quot; aria-pressed=&quot;${state.condition===&#x27;afternoon&#x27;}&quot;&gt;🕒 午後から&lt;/button&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-condition=&quot;overnight&quot; aria-pressed=&quot;${state.condition===&#x27;overnight&#x27;}&quot;&gt;🧳 今から1泊&lt;/button&gt;&lt;/div&gt;${button(&#x27;✦　条件に合う場所を見る&#x27;,&#x27;suggest&#x27;)}&lt;/div&gt;${state.suggested?`&lt;div class=&quot;tm-suggest-card&quot;&gt;&lt;span class=&quot;tm-result-icon&quot; aria-hidden=&quot;true&quot;&gt;${candidate.icon}&lt;/span&gt;&lt;span class=&quot;tm-eyebrow&quot;&gt;サンプル提案&lt;/span&gt;&lt;h2&gt;${candidate.name}&lt;/h2&gt;&lt;p&gt;${candidate.reason}&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;tm-primary cursor-interaction&quot; data-action=&quot;suggest-plan&quot; data-place=&quot;${candidate.name}&quot;&gt;この場所でしおりを作る →&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;tm-section-head&quot;&gt;&lt;h2&gt;気になる旅のたね&lt;/h2&gt;&lt;button class=&quot;tm-text-link cursor-interaction&quot; type=&quot;button&quot; data-screen=&quot;wish&quot;&gt;地図で見る →&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tm-list&quot;&gt;${state.places.slice(0,2).map(p=&gt;placeCard(p)).join(&#x27;&#x27;)}&lt;/div&gt;`}
  function allSpots(){
    const byName=new Map();
    state.places.forEach(p=&gt;byName.set(p.name,{...p,wish:true,visits:0}));
    state.visits.forEach(v=&gt;{const p=byName.get(v.name)||{name:v.name,icon:v.icon,tone:&#x27;mint&#x27;,meta:&#x27;訪問した場所&#x27;,region:v.name.includes(&#x27;神戸&#x27;)?&#x27;神戸&#x27;:v.name.includes(&#x27;白浜&#x27;)?&#x27;和歌山&#x27;:&#x27;大阪&#x27;,wish:false,visits:0};p.visits++;byName.set(v.name,p)});
    return [...byName.values()];
  }
  function status(p){return p.wish&amp;&amp;p.visits?&#x27;行きたい・行った&#x27;:p.wish?&#x27;行きたい&#x27;:&#x27;行った&#x27;}
  function position(p,i){const named={&#x27;アドベンチャーワールド&#x27;:[67,70],&#x27;奈良公園&#x27;:[76,34],&#x27;海遊館&#x27;:[46,37],&#x27;神戸どうぶつ王国&#x27;:[21,47],&#x27;白浜&#x27;:[56,81]};if(named[p.name])return named[p.name];const regions={&#x27;大阪&#x27;:[29,61],&#x27;和歌山&#x27;:[31,72],&#x27;奈良&#x27;:[78,55],&#x27;神戸&#x27;:[17,71]};const base=regions[p.region]||[48,55];return [Math.min(82,base[0]+(i%3)*8),Math.min(82,base[1]+(i%3)*9)]}
  function mapPanel(items){return `&lt;div class=&quot;tm-legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;tm-dot wish&quot;&gt;&lt;/i&gt;行きたい&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;tm-dot visited&quot;&gt;&lt;/i&gt;行った&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;tm-dot both&quot;&gt;&lt;/i&gt;両方&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tm-map&quot; role=&quot;group&quot; aria-label=&quot;スポットの配置イメージ&quot;&gt;&lt;span class=&quot;tm-map-label osaka&quot;&gt;大阪&lt;/span&gt;&lt;span class=&quot;tm-map-label kobe&quot;&gt;神戸&lt;/span&gt;&lt;span class=&quot;tm-map-label nara&quot;&gt;奈良&lt;/span&gt;&lt;span class=&quot;tm-map-label shirahama&quot;&gt;白浜&lt;/span&gt;${items.map((p,i)=&gt;{const [x,y]=position(p,i);const kind=p.wish&amp;&amp;p.visits?&#x27;both&#x27;:p.wish?&#x27;wish&#x27;:&#x27;visited&#x27;;return `&lt;button class=&quot;tm-pin cursor-interaction ${kind}&quot; style=&quot;left:${x}%;top:${y}%&quot; type=&quot;button&quot; data-map-pick=&quot;${esc(p.name)}&quot; aria-label=&quot;${esc(p.name)}、${status(p)}&quot;&gt;&lt;span&gt;${p.icon}&lt;/span&gt;&lt;/button&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;${state.mapPick?(()=&gt;{const p=allSpots().find(x=&gt;x.name===state.mapPick);return p?`&lt;div class=&quot;tm-map-detail&quot;&gt;&lt;strong&gt;${p.icon}　${esc(p.name)}&lt;/strong&gt;&lt;span&gt;${status(p)}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;tm-card-action cursor-interaction&quot; data-action=&quot;plan-place&quot; data-place=&quot;${esc(p.name)}&quot;&gt;この場所でしおりを作る →&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;})():&#x27;&#x27;}&lt;p class=&quot;tm-map-note&quot;&gt;ピンの位置は画面案の例です。実際のアプリでは場所を確認して地図に表示します。&lt;/p&gt;`}
  function wish(){const spots=allSpots();const filtered=spots.filter(p=&gt;state.spotFilter===&#x27;all&#x27;||state.spotFilter===&#x27;wish&#x27;&amp;&amp;p.wish||state.spotFilter===&#x27;visited&#x27;&amp;&amp;p.visits);return `&lt;div class=&quot;tm-page-top&quot;&gt;&lt;span class=&quot;tm-eyebrow&quot;&gt;SPOT MAP ◎&lt;/span&gt;&lt;h1&gt;旅のスポット&lt;/h1&gt;&lt;p&gt;行きたい場所も、行った場所も、一枚に。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tm-view-tabs&quot; aria-label=&quot;スポットの表示&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-spot-view=&quot;map&quot; aria-pressed=&quot;${state.spotView===&#x27;map&#x27;}&quot;&gt;地図&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-spot-view=&quot;list&quot; aria-pressed=&quot;${state.spotView===&#x27;list&#x27;}&quot;&gt;一覧&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tm-chips tm-spot-filters&quot; aria-label=&quot;スポットの状態&quot;&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-spot-filter=&quot;all&quot; aria-pressed=&quot;${state.spotFilter===&#x27;all&#x27;}&quot;&gt;すべて ${spots.length}&lt;/button&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-spot-filter=&quot;wish&quot; aria-pressed=&quot;${state.spotFilter===&#x27;wish&#x27;}&quot;&gt;♡ 行きたい&lt;/button&gt;&lt;button class=&quot;tm-chip cursor-interaction&quot; type=&quot;button&quot; data-spot-filter=&quot;visited&quot; aria-pressed=&quot;${state.spotFilter===&#x27;visited&#x27;}&quot;&gt;✓ 行った&lt;/button&gt;&lt;/div&gt;${state.spotView===&#x27;map&#x27;?mapPanel(filtered):`&lt;div class=&quot;tm-list&quot;&gt;${filtered.map(p=&gt;`&lt;div class=&quot;tm-wish-card&quot;&gt;${placeCard(p)}&lt;span class=&quot;tm-spot-status&quot;&gt;${status(p)}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}&lt;div style=&quot;margin-top:13px&quot;&gt;${button(&#x27;＋　スポットを追加&#x27;,&#x27;add&#x27;,&#x27;tm-outline&#x27;)}&lt;/div&gt;`}
  function itinerary(){const n=esc(state.selected);const day1=[[&#x27;14:00&#x27;,&#x27;出発&#x27;,&#x27;おやつや休憩の時間も確保&#x27;],[&#x27;16:30&#x27;,&#x27;到着・チェックイン&#x27;,&#x27;宿泊先はこれから選択&#x27;],[&#x27;18:00&#x27;,&#x27;夕食&#x27;,&#x27;近くでゆったり&#x27;]];const day2=[[&#x27;09:30&#x27;,n,&#x27;営業時間・チケットは要確認&#x27;],[&#x27;12:30&#x27;,&#x27;昼食とひと休み&#x27;,&#x27;子どものペースで&#x27;],[&#x27;15:00&#x27;,&#x27;帰路へ&#x27;,&#x27;混雑や天候に合わせて調整&#x27;]];const entries=state.day===1?day1:day2;return `&lt;div class=&quot;tm-day-tabs&quot; aria-label=&quot;旅の日程&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-day=&quot;1&quot; aria-pressed=&quot;${state.day===1}&quot;&gt;1日目&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-day=&quot;2&quot; aria-pressed=&quot;${state.day===2}&quot;&gt;2日目&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tm-timeline&quot;&gt;${entries.map(e=&gt;`&lt;div class=&quot;tm-stop&quot;&gt;&lt;strong&gt;${e[0]}　${e[1]}&lt;/strong&gt;&lt;p&gt;${e[2]}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;tm-note&quot;&gt;☔ 雨なら屋内の候補へ変更。営業・空室・移動時間は実際の計画時に確認します。&lt;/div&gt;${button(&#x27;✓　しおりを保存&#x27;,&#x27;save-plan&#x27;)}${button(&#x27;行った思い出として記録&#x27;,&#x27;record&#x27;,&#x27;tm-outline&#x27;)}`}
  function travel(){const r=state.routes[state.routeDir];return `&lt;div class=&quot;tm-section-head&quot;&gt;&lt;h2&gt;どうやって行く？&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;tm-day-tabs&quot; aria-label=&quot;移動手段&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-transport=&quot;transit&quot; aria-pressed=&quot;${state.transportMode===&#x27;transit&#x27;}&quot;&gt;🚃 電車・バス&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-transport=&quot;car&quot; aria-pressed=&quot;${state.transportMode===&#x27;car&#x27;}&quot;&gt;🚗 車&lt;/button&gt;&lt;/div&gt;${state.transportMode===&#x27;car&#x27;?`&lt;div class=&quot;tm-route-card&quot;&gt;&lt;strong&gt;車での移動メモ&lt;/strong&gt;&lt;p&gt;駐車場や立ち寄り場所を書いておけます。&lt;/p&gt;&lt;label for=&quot;tm-car-note&quot;&gt;メモ&lt;/label&gt;&lt;input id=&quot;tm-car-note&quot; value=&quot;${esc(state.carNote)}&quot;&gt;${button(&#x27;移動メモを保存&#x27;,&#x27;save-car&#x27;,&#x27;tm-outline&#x27;)}&lt;/div&gt;`:`&lt;div class=&quot;tm-day-tabs&quot; aria-label=&quot;往復の切替&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-route-dir=&quot;out&quot; aria-pressed=&quot;${state.routeDir===&#x27;out&#x27;}&quot;&gt;往路&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; type=&quot;button&quot; data-route-dir=&quot;back&quot; aria-pressed=&quot;${state.routeDir===&#x27;back&#x27;}&quot;&gt;復路&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tm-route-card&quot;&gt;&lt;span class=&quot;tm-eyebrow&quot;&gt;登録した乗換メモ&lt;/span&gt;&lt;div class=&quot;tm-route-stops&quot;&gt;&lt;div&gt;&lt;b&gt;●&lt;/b&gt;&lt;span&gt;${esc(r.time)}　${esc(r.from)}&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;↳&lt;/b&gt;&lt;span&gt;${esc(r.via)}で乗換&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;●&lt;/b&gt;&lt;span&gt;${esc(r.to)} に到着&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;🎫 ${esc(r.memo)}&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;tm-route-edit&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;✎　乗換情報を編集する&lt;/summary&gt;&lt;div class=&quot;tm-route-form&quot;&gt;&lt;label for=&quot;tm-from&quot;&gt;出発駅・停留所&lt;/label&gt;&lt;input id=&quot;tm-from&quot; value=&quot;${esc(r.from)}&quot;&gt;&lt;label for=&quot;tm-via&quot;&gt;乗換駅・停留所&lt;/label&gt;&lt;input id=&quot;tm-via&quot; value=&quot;${esc(r.via)}&quot;&gt;&lt;label for=&quot;tm-to&quot;&gt;到着駅・停留所&lt;/label&gt;&lt;input id=&quot;tm-to&quot; value=&quot;${esc(r.to)}&quot;&gt;&lt;label for=&quot;tm-time&quot;&gt;出発時刻&lt;/label&gt;&lt;input id=&quot;tm-time&quot; type=&quot;time&quot; value=&quot;${esc(r.time)}&quot;&gt;&lt;label for=&quot;tm-route-memo&quot;&gt;路線・便・切符のメモ&lt;/label&gt;&lt;input id=&quot;tm-route-memo&quot; value=&quot;${esc(r.memo)}&quot;&gt;${button(&#x27;乗換情報を保存&#x27;,&#x27;save-route&#x27;)}&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;tm-map-note&quot;&gt;時刻と路線は入力例です。実際の乗換案内とは連動していません。&lt;/p&gt;`}`}
